version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: aura_postgres
    restart: always

    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aura_redis
    restart: always

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: aura_qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:

  postgres_data:

  qdrant_data: